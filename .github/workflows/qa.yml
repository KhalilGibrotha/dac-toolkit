name: Release QA

# Functional smoke tests that run INSIDE the published image — the release
# gate between "image published" and "tag it stable". Dispatch manually after
# a main build publishes :latest; tag the release only when this is green.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to test"
        default: "latest"
        required: true

jobs:
  release-qa:
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:${{ inputs.image_tag }}
    steps:
      - name: Toolchain present and answering
        run: |
          set -e
          for cmd in docx-build docx-build-all dac-init dac-update gen-stock-hashes.py \
                     lint-frontmatter.py lint-mermaid.py lint-encoding.py \
                     vale pandoc pre-commit markdownlint-cli2 mmdc \
                     quarto render-decks.sh; do
            command -v "$cmd" >/dev/null || { echo "MISSING: $cmd"; exit 1; }
          done
          pandoc -v | head -1
          vale -v
          pre-commit --version
          python3 -c "import docx_builder; print('docx_builder import OK')"

      - name: Deck toolchain renders a PowerPoint end to end
        run: |
          # pipefail matters here: without it `quarto check | tail` reports
          # tail's exit status, which always succeeds, so a broken Quarto would
          # sail through this gate unnoticed.
          set -eo pipefail
          quarto check 2>&1 | tail -3

          # Exercise the SHIPPED entry point rather than calling quarto by
          # hand. Rendering a throwaway deck proved only that quarto works --
          # render-decks.sh itself could be broken and this gate stayed green,
          # which is the gap this job exists to close. --smoke renders the
          # bundled example through the real script and asserts a figure image
          # embedded, so a broken wrapper, a bad bundled path, or a broken
          # Jupyter/matplotlib integration all fail here.
          render-decks.sh --smoke

      - name: Baked starter tree is intact and hash-history-complete
        run: |
          set -e
          test -f /opt/dac-toolkit/starter/manifest.json
          test -f /opt/dac-toolkit/starter/stock-hashes.json
          count=$(python3 -c "import json;print(len(json.load(open('/opt/dac-toolkit/starter/manifest.json'))['files']))")
          echo "managed files in manifest: $count"
          test "$count" -ge 40
          gen-stock-hashes.py --starter /opt/dac-toolkit/starter/files \
            --history /opt/dac-toolkit/starter/stock-hashes.json --verify

      - name: dac-init behaves (install, idempotence, provenance)
        run: |
          set -e
          repo=$(mktemp -d); mkdir "$repo/.git"
          dac-init --path "$repo" --dry-run | tee /tmp/dry.out
          grep -q "already present" /tmp/dry.out
          dac-init --path "$repo" | tee /tmp/run1.out
          grep -qE "^[1-9][0-9]* installed" /tmp/run1.out
          dac-init --path "$repo" | tee /tmp/run2.out
          grep -q "^0 installed" /tmp/run2.out
          python3 -c "
          import json,sys
          d=json.load(open('$repo/dac/.dac-manifest.json'))
          assert d['files'], 'manifest recorded no files'
          print('provenance recorded for', len(d['files']), 'files')"

      - name: dac-update behaves (no-op when current, keep+new on customization)
        run: |
          set -e
          repo=$(mktemp -d); mkdir "$repo/.git"
          dac-init --path "$repo" >/dev/null

          # A freshly initialized repo is byte-identical to stock -> no-op.
          dac-update --path "$repo" --dry-run | tee /tmp/update-dry.out
          grep -q "already current" /tmp/update-dry.out
          dac-update --path "$repo" | tee /tmp/update-run.out
          grep -qE "^0 installed, 0 replaced" /tmp/update-run.out

          # A locally customized file must be left untouched, with a .new
          # written beside it for review instead of being overwritten.
          target="$repo/.markdownlint.json"
          echo '{"customized": true}' > "$target"
          dac-update --path "$repo" | tee /tmp/update-custom.out
          grep -q "keep+new  .markdownlint.json" /tmp/update-custom.out
          grep -q '"customized": true' "$target"
          test -f "$target.new"

          python3 -c "
          import json
          d=json.load(open('$repo/dac/.dac-manifest.json'))
          assert 'updated' in d, 'dac-update did not stamp an updated date'
          assert d.get('installed'), 'installed date lost'
          assert '.markdownlint.json' not in d.get('files', {}), \
            'customized file recorded as stock in the manifest'
          print('manifest ok: installed', d['installed'], 'updated', d['updated'])"

      - name: docx-build renders a document end to end
        run: |
          set -e
          work=$(mktemp -d); cd "$work"
          cat > doc.md <<'EOF'
          ---
          title: "QA Smoke Document"
          doc_type: "reference"
          domain: "qa"
          department: "QA"
          owner: "QA"
          status: "Draft"
          version: "0.1"
          date: "2026-07-25"
          author: "QA"
          ---

          # QA Smoke Document

          This reference confirms the toolchain renders a document.

          ## A Table

          | Key | Value |
          |---|---|
          | works | yes |
          EOF
          docx-build doc.md --org /opt/dac-toolkit/starter/files/dac/org.yaml.example \
            --output out.docx
          test -s out.docx
          size=$(stat -c%s out.docx)
          echo "rendered out.docx ($size bytes)"
          test "$size" -gt 10000
