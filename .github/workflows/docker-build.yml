name: Build and Push Dev Container Image

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/Dockerfile.devspaces'
      - '.devcontainer/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/khalilgibrotha/dac-toolkit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless signing + attestation OIDC
      attestations: write    # actions/attest-*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the OCI annotation set (source, revision, created, ...) so the
      # image identifies itself instead of inheriting the UBI base's labels.
      - name: Derive tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=dac-toolkit
            org.opencontainers.image.description=Documentation-as-code toolchain (docx_builder, Quarto, Pandoc, Mermaid CLI, Vale) for OpenShift Dev Spaces
            org.opencontainers.image.licenses=MIT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so the scan gates publication rather
      # than trailing it. The push below reuses this layer cache.
      - name: Build for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile.devspaces
          load: true
          push: false
          tags: dac-toolkit:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed keeps the gate on things we can actually act on; an
      # unfixable base CVE should not block every build.
      #
      # skip-files: three vendored, prebuilt Go binaries. Their findings are Go
      # *stdlib* CVEs compiled in at upstream's build time, so they are not
      # remediable from this Dockerfile - gh and vale are already pinned to the
      # latest upstream release and still report them; only an upstream rebuild
      # against a patched Go toolchain clears them. Dependabot keeps the pins
      # current so those rebuilds are picked up automatically. esbuild is
      # vendored inside Quarto and only ever bundles our own document and deck
      # sources here; clearing it means upgrading Quarto, which changes pptx
      # rendering and so needs a deck re-render and visual QA rather than a
      # silent bump. Its path is version-pinned so a Quarto bump invalidates the
      # skip and forces the question to be re-asked.
      #
      # The gate stays fully active for everything we do control: the RHEL base
      # layer, Python packages, and anything added by this Dockerfile.
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dac-toolkit:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: |
            /opt/quarto-1.6.40/bin/tools/x86_64/esbuild
            /usr/bin/gh
            /usr/local/bin/vale

      - name: Push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile.devspaces
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # CycloneDX rather than SPDX: this image bundles jupyterlab, whose node
      # test fixtures push an SPDX SBOM past GitHub's 16 MiB attestation
      # predicate cap. CycloneDX is materially more compact for the same
      # content.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # Always retain the SBOM, independent of whether it fits the attestation
      # predicate cap. This is the durable copy.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      # continue-on-error: the 16 MiB predicate cap is a hard GitHub limit and
      # depends on how large the dependency graph happens to be. A registry SBOM
      # attestation is worth attempting, but it must not block publishing or
      # signing - the uploaded artifact above is the guaranteed copy.
      - name: Attest SBOM
        continue-on-error: true
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # The digest is what consumers should pin and what promotion copies.
      - name: Publish digest to job summary
        run: |
          {
            echo "### Published image"
            echo
            echo "Pin this digest in content-repo devfiles and promote by it:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify signature:"
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
